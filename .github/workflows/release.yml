name: Release (manual)

# Optional: builds CyberDisk on GitHub and publishes the release. Start it yourself:
# GitHub > Actions > "Release (manual)" > Run workflow > type the version, for example 1.4.2.
# The normal way is tools/release.ps1 on your own PC.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, for example 1.4.2'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build CyberDisk.csproj -c Release

      - name: Prepare the release files
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path bin -Recurse -Filter CyberDisk.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw 'CyberDisk.exe was not found after the build.' }
          Copy-Item $exe.FullName CyberDisk.exe
          $hash = (Get-FileHash CyberDisk.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  CyberDisk.exe" | Out-File -Encoding ascii CyberDisk.exe.sha256

          $version = '${{ github.event.inputs.version }}'
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($version))\].*?(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Value.Trim() } else { "CyberDisk $version" }
          $notes += "`n`n---`n**SHA-256:** ``$hash```n`nWindows may show a SmartScreen notice for a new unsigned program: click **More info**, then **Run anyway**."
          Set-Content -Path release-notes.md -Value $notes -Encoding UTF8

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: CyberDisk ${{ github.event.inputs.version }}
          body_path: release-notes.md
          files: |
            CyberDisk.exe
            CyberDisk.exe.sha256
